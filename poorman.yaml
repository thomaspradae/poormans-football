setup: null

toolchain: unity

unity:
  memory_mb: 6144
  max_single_file_mb: 0
  process_limit: 512
  network_for_license: false
  editmode_tests: false
  playmode_tests: false

test: null
lint: null
typecheck: null
build: null

# Controller-only test. This command is never included in the builder prompt.
hidden_test: null

timeout_seconds: 600
max_patch_lines: 2000
max_files_changed: 100
no_new_dependencies: false

protected:
  - ".git/**"
  - ".github/workflows/**"
  - "secrets/**"
  - ".env"
  - "Library/**"
  - "Temp/**"
  - "Logs/**"
  - "Obj/**"
  - "Builds/**"
  - "UserSettings/**"

# Optional dependency manifests to protect when no_new_dependencies=true.
dependency_files:
  - "pyproject.toml"
  - "requirements.txt"
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "Packages/manifest.json"
  - "Packages/packages-lock.json"

# Additional untracked artifacts to exclude from acceptance diffs.
verification_ignore:
  - "Library/**"
  - "Temp/**"
  - "Logs/**"
  - "Obj/**"
  - "Builds/**"
  - "UserSettings/**"
